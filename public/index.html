<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyDeck</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem("theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
    } catch {}
  </script>
</head>
<body class="h-dvh bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">
  <div class="flex h-full">
    <!-- Sidebar (desktop) -->
    <aside class="hidden w-64 shrink-0 flex-col border-r border-slate-200 bg-white md:flex dark:border-slate-800 dark:bg-slate-900">
      <div class="flex items-center gap-2.5 px-5 pt-5 pb-4">
        <img src="/logo.svg" alt="" class="h-8 w-8" />
        <div>
          <div class="text-[17px] font-bold tracking-tight">Study<span class="text-indigo-600 dark:text-indigo-400">Deck</span></div>
          <div class="text-[11px] text-slate-500 dark:text-slate-400">Answers from your notes. Only.</div>
        </div>
      </div>

      <div class="px-3 pb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center justify-between">
        <span class="px-2">Courses</span>
        <kbd class="rounded border border-slate-200 px-1.5 font-sans text-[10px] font-medium text-slate-400 dark:border-slate-700">⌘K</kbd>
      </div>
      <nav id="courses" class="flex-1 space-y-0.5 overflow-y-auto px-3"></nav>

      <div class="space-y-3 border-t border-slate-100 p-4 dark:border-slate-800">
        <div id="streak" class="rounded-xl bg-gradient-to-br from-orange-50 to-amber-50 px-3 py-2.5 text-xs text-amber-900 dark:from-orange-500/10 dark:to-amber-500/10 dark:text-amber-200"></div>
        <label class="flex cursor-pointer items-center justify-between text-xs text-slate-600 dark:text-slate-300">
          <span><b class="font-semibold">Demo mode</b><span class="block text-[11px] text-slate-400">Use built-in sample notes</span></span>
          <input id="demo" type="checkbox" class="peer sr-only" />
          <span class="relative h-5 w-9 rounded-full bg-slate-200 transition peer-checked:bg-indigo-600 dark:bg-slate-700 after:absolute after:top-0.5 after:left-0.5 after:h-4 after:w-4 after:rounded-full after:bg-white after:shadow after:transition peer-checked:after:translate-x-4"></span>
        </label>
        <div class="flex gap-2">
          <button id="syncBtn" class="flex-1 rounded-lg bg-slate-900 py-2 text-xs font-medium text-white transition hover:bg-slate-700 disabled:opacity-60 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white">Sync from Granola</button>
          <button class="theme-toggle rounded-lg border border-slate-200 px-2.5 text-sm transition hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800" title="Toggle dark mode" aria-label="Toggle dark mode">🌓</button>
        </div>
        <div id="syncStatus" class="hidden max-h-36 overflow-y-auto whitespace-pre-wrap rounded-lg bg-slate-50 p-2 text-[11px] text-slate-600 dark:bg-slate-800 dark:text-slate-300"></div>
      </div>
    </aside>

    <!-- Chat -->
    <main class="flex min-w-0 flex-1 flex-col">
      <header class="flex items-center justify-between gap-3 border-b border-slate-200 bg-white/80 px-4 py-3 backdrop-blur md:px-6 dark:border-slate-800 dark:bg-slate-900/80">
        <div class="flex min-w-0 items-center gap-3">
          <img src="/logo.svg" alt="StudyDeck" class="h-7 w-7 md:hidden" />
          <button id="scopeBtn" class="min-w-0 text-left" title="Switch course (⌘K)">
            <div class="flex items-center gap-2">
              <span id="scopeDot" class="h-2.5 w-2.5 shrink-0 rounded-full bg-slate-400"></span>
              <span id="scopeTitle" class="truncate font-semibold">All courses</span>
              <span class="text-slate-400 md:hidden">▾</span>
            </div>
            <div id="scopeSub" class="truncate text-xs text-slate-500 dark:text-slate-400"></div>
          </button>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <span id="sourceBadge" class="hidden rounded-full bg-amber-100 px-2.5 py-0.5 text-[11px] font-semibold text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">Sample notes</span>
          <button class="theme-toggle rounded-lg px-2 py-1 text-sm md:hidden" aria-label="Toggle dark mode">🌓</button>
          <button id="clearBtn" class="rounded-lg px-2 py-1 text-xs text-slate-500 transition hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10">Clear</button>
        </div>
      </header>

      <div id="messages" class="flex-1 space-y-5 overflow-y-auto px-4 py-6 md:px-8"></div>

      <form id="form" class="border-t border-slate-200 bg-white px-4 pt-3 pb-4 md:px-8 dark:border-slate-800 dark:bg-slate-900">
        <div id="tryRow" class="no-scrollbar mb-3 hidden gap-2 overflow-x-auto"></div>
        <div class="flex gap-2">
          <input id="q" autocomplete="off" placeholder="Ask about your notes…" enterkeyhint="send"
            class="min-w-0 flex-1 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm shadow-sm transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/15 focus:outline-none dark:border-slate-700 dark:bg-slate-800" />
          <button id="send" class="flex items-center gap-2 rounded-xl bg-indigo-600 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 active:scale-95 disabled:opacity-60">
            <span id="sendLabel">Ask</span>
          </button>
        </div>
        <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
          <label class="inline-flex cursor-pointer items-center gap-2 text-xs text-slate-600 select-none dark:text-slate-400">
            <input id="general" type="checkbox" class="h-3.5 w-3.5 accent-amber-500" />
            <span>Use general knowledge <span class="text-slate-400 dark:text-slate-500">(outside info is labeled)</span></span>
          </label>
          <span class="hidden text-[11px] text-slate-400 sm:inline"><kbd>Enter</kbd> to send · <kbd>⌘K</kbd> switch course · <kbd>/</kbd> focus</span>
        </div>
      </form>
    </main>

    <!-- Source panel: side panel on desktop, full-screen sheet on phones -->
    <aside id="source" class="fixed inset-0 z-30 hidden flex-col bg-white md:static md:z-auto md:w-[28rem] md:shrink-0 md:border-l md:border-slate-200 dark:bg-slate-900 dark:md:border-slate-800">
      <div class="flex items-start justify-between gap-2 border-b border-slate-100 px-5 py-3 dark:border-slate-800">
        <div class="min-w-0">
          <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Source note</div>
          <div id="sourceTitle" class="truncate text-sm font-semibold"></div>
        </div>
        <button id="closeSource" class="rounded-lg px-2 text-xl leading-none text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800" aria-label="Close source">×</button>
      </div>
      <div id="sourceBody" class="md flex-1 overflow-y-auto px-5 py-3 text-sm"></div>
    </aside>
  </div>

  <!-- Course picker (⌘K, and the course menu on phones) -->
  <div id="picker" class="fixed inset-0 z-40 hidden items-start justify-center bg-slate-900/40 p-4 pt-[12vh] backdrop-blur-sm">
    <div class="fade-in w-full max-w-md overflow-hidden rounded-2xl bg-white shadow-2xl ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700">
      <input id="pickerInput" placeholder="Switch course…" class="w-full border-b border-slate-100 bg-transparent px-4 py-3 text-sm focus:outline-none dark:border-slate-800" />
      <div id="pickerList" class="max-h-80 overflow-y-auto p-2"></div>
      <div class="flex items-center justify-between border-t border-slate-100 px-4 py-2 text-[11px] text-slate-400 dark:border-slate-800">
        <span>↑↓ to move · Enter to select · Esc to close</span>
        <label class="flex items-center gap-1.5 md:hidden"><input id="demoMobile" type="checkbox" class="accent-indigo-600" /> Demo mode</label>
      </div>
    </div>
  </div>

  <!-- Citation hover preview -->
  <div id="preview" class="pointer-events-none fixed z-50 hidden max-w-sm rounded-xl bg-slate-900 px-3.5 py-2.5 text-xs leading-relaxed text-slate-100 shadow-xl dark:bg-slate-100 dark:text-slate-900"></div>

  <script src="/app.js"></script>
</body>
</html>
